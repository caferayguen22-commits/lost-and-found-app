<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Lost & Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-center items-center font-sans antialiased selection:bg-indigo-500 selection:text-white py-12">

    <main class="w-full max-w-2xl px-6">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 sm:text-5xl">
                Lost & Found
            </h1>
            <p class="mt-3 text-gray-400 text-lg">Berlin Community Hub – Schnell, intelligent, direkt.</p>
        </header>

        <section id="selection-buttons" class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8">
            <button id="btn-lost" class="group relative flex flex-col justify-center items-center p-8 bg-gray-900 border border-gray-800 rounded-3xl transition-all duration-300 hover:border-red-500/50 hover:bg-gradient-to-b hover:from-gray-900 hover:to-red-950/20 shadow-xl active:scale-95">
                <div class="w-14 h-14 mb-3 rounded-2xl bg-red-500/10 flex items-center justify-center text-red-400 font-bold text-2xl group-hover:scale-110 transition-transform">?</div>
                <span class="text-xl font-bold tracking-wide group-hover:text-red-400 transition-colors">Etwas verloren</span>
            </button>
            <button id="btn-found" class="group relative flex flex-col justify-center items-center p-8 bg-gray-900 border border-gray-800 rounded-3xl transition-all duration-300 hover:border-emerald-500/50 hover:bg-gradient-to-b hover:from-gray-900 hover:to-emerald-950/20 shadow-xl active:scale-95">
                <div class="w-14 h-14 mb-3 rounded-2xl bg-emerald-500/10 flex items-center justify-center text-emerald-400 font-bold text-2xl group-hover:scale-110 transition-transform">!</div>
                <span class="text-xl font-bold tracking-wide group-hover:text-emerald-400 transition-colors">Etwas gefunden</span>
            </button>
        </section>

        <section id="form-container" class="hidden bg-gray-900 border border-gray-800 rounded-3xl p-8 shadow-2xl transition-all duration-500">
            <div class="flex justify-between items-center mb-6">
                <h2 id="form-title" class="text-2xl font-bold text-white">Meldung erfassen</h2>
                <button id="btn-back" class="text-gray-500 hover:text-gray-300 text-sm font-semibold transition-colors">&larr; Zurück</button>
            </div>

            <div id="hint-box" class="mb-6 p-4 rounded-2xl bg-indigo-950/40 border border-indigo-800/40 text-indigo-200 text-sm leading-relaxed"></div>

            <form id="item-form" class="space-y-5" autocomplete="off">
                <input type="hidden" id="item-type" name="type">

                <!-- 8 Kategorien für 2026 -->
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Kategorie</label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <label class="cursor-pointer"><input type="radio" name="category" value="Smartphone" class="peer hidden" checked><div class="p-2 text-center bg-gray-950 border border-gray-800 rounded-xl peer-checked:border-indigo-500 peer-checked:bg-indigo-950/30 text-xs font-semibold text-gray-300 transition-all">📱 Smartphone</div></label>
                        <label class="cursor-pointer"><input type="radio" name="category" value="Kopfhörer" class="peer hidden"><div class="p-2 text-center bg-gray-950 border border-gray-800 rounded-xl peer-checked:border-indigo-500 peer-checked:bg-indigo-950/30 text-xs font-semibold text-gray-300 transition-all">🎧 Kopfhörer</div></label>
                        <label class="cursor-pointer"><input type="radio" name="category" value="Schlüssel" class="peer hidden"><div class="p-2 text-center bg-gray-950 border border-gray-800 rounded-xl peer-checked:border-indigo-500 peer-checked:bg-indigo-950/30 text-xs font-semibold text-gray-300 transition-all">🔑 Schlüssel</div></label>
                        <label class="cursor-pointer"><input type="radio" name="category" value="Geldbörse" class="peer hidden"><div class="p-2 text-center bg-gray-950 border border-gray-800 rounded-xl peer-checked:border-indigo-500 peer-checked:bg-indigo-950/30 text-xs font-semibold text-gray-300 transition-all">👛 Geldbörse</div></label>
                        <label class="cursor-pointer"><input type="radio" name="category" value="Tasche" class="peer hidden"><div class="p-2 text-center bg-gray-950 border border-gray-800 rounded-xl peer-checked:border-indigo-500 peer-checked:bg-indigo-950/30 text-xs font-semibold text-gray-300 transition-all">🎒 Tasche/Rucksack</div></label>
                        <label class="cursor-pointer"><input type="radio" name="category" value="Laptop/Tablet" class="peer hidden"><div class="p-2 text-center bg-gray-950 border border-gray-800 rounded-xl peer-checked:border-indigo-500 peer-checked:bg-indigo-950/30 text-xs font-semibold text-gray-300 transition-all">💻 Laptop/Tablet</div></label>
                        <label class="cursor-pointer"><input type="radio" name="category" value="Brille" class="peer hidden"><div class="p-2 text-center bg-gray-950 border border-gray-800 rounded-xl peer-checked:border-indigo-500 peer-checked:bg-indigo-950/30 text-xs font-semibold text-gray-300 transition-all">👓 Brille</div></label>
                        <label class="cursor-pointer"><input type="radio" name="category" value="Sonstiges" class="peer hidden"><div class="p-2 text-center bg-gray-950 border border-gray-800 rounded-xl peer-checked:border-indigo-500 peer-checked:bg-indigo-950/30 text-xs font-semibold text-gray-300 transition-all">📦 Sonstiges</div></label>
                    </div>
                </div>

                <!-- Dynamische Marken-Auswahl -->
                <div id="brand-selection-container" class="hidden space-y-2">
                    <label class="block text-sm font-medium text-gray-400">Hersteller / Marke</label>
                    <div class="flex flex-wrap gap-2" id="brand-buttons"></div>
                </div>

                <!-- Dynamische Modell-Auswahl -->
                <div id="model-selection-container" class="hidden space-y-2">
                    <label class="block text-sm font-medium text-gray-400">Schnellauswahl Modelle</label>
                    <div class="flex flex-wrap gap-2" id="model-chips"></div>
                </div>

                <div id="safety-tip" class="p-3 rounded-xl bg-gray-950 border border-gray-800/80 text-gray-400 text-xs flex items-center gap-2">
                    <span>💡</span><span id="safety-tip-text">Tipp für die Übergabe: Verabredet euch an einem öffentlichen Ort.</span>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Gegenstand / Modell</label>
                    <input type="text" id="item-title" required placeholder="Was genau?" class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Beschreibung & Details</label>
                    <textarea id="item-description" rows="3" required placeholder="Farbe, Zustand, Besonderheiten..." class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Ort</label>
                    <input type="text" id="item-location" required placeholder="z. B. Ringbahn S41 oder U8" class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Foto (Optional)</label>
                    <input type="file" id="item-image" accept="image/*" class="w-full px-4 py-2 text-xs bg-gray-950 border border-gray-800 rounded-xl text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-950 file:text-indigo-300 hover:file:bg-indigo-900 cursor-pointer">
                </div>

                <button type="submit" id="submit-btn" class="w-full py-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold rounded-xl shadow-lg transition-all transform active:scale-98">
                    Meldung absenden & KI-Matching starten
                </button>
            </form>
        </section>

        <!-- Result & Dashboard Container (unverändert wie in vorheriger Antwort, der Kürze halber hier weggelassen bzw. sie bleiben exakt gleich) -->
        <section id="result-container" class="hidden mt-8 bg-gray-900 border border-indigo-500/30 rounded-3xl p-8 shadow-2xl transition-all duration-500">
            <h3 class="text-xl font-bold text-indigo-400 mb-4">KI-Analyse & Status</h3>
            <div id="result-content" class="text-gray-300 space-y-4 whitespace-pre-line text-sm leading-relaxed"></div>
            <button id="btn-reset" class="mt-6 w-full py-3 bg-gray-800 hover:bg-gray-700 text-white font-semibold rounded-xl transition-colors">Neue Suche starten</button>
        </section>

        <section id="dashboard-container" class="mt-12">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-white">Community-Meldungen</h3>
                <button id="btn-refresh" class="text-xs bg-gray-900 border border-gray-800 hover:border-indigo-500 text-gray-400 hover:text-white px-3 py-2 rounded-xl transition-all">Aktualisieren</button>
            </div>
            <div id="items-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>

    </main>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
