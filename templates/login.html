<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Lost & Found Berlin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col justify-center items-center font-sans antialiased selection:bg-indigo-500 selection:text-white py-12 transition-colors duration-300">

    <main class="w-full max-w-md px-6">
        <header class="text-center mb-10 relative">
            <button id="theme-toggle" type="button"
                class="absolute right-0 top-0 w-11 h-11 flex items-center justify-center rounded-full bg-gray-200 dark:bg-gray-900 border border-gray-300 dark:border-gray-800 text-gray-600 dark:text-gray-300 hover:border-indigo-500/50 transition-all"
                aria-label="Hell-/Dunkelmodus umschalten">
                <span id="theme-icon">🌙</span>
            </button>
            <a href="/" class="absolute left-0 top-0 h-11 flex items-center text-sm font-semibold text-gray-500 hover:text-gray-800 dark:hover:text-gray-300 transition-colors">&larr; Zurück</a>
            <h1 class="px-20 text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 sm:text-4xl">
                Login
            </h1>
            <p class="mt-3 text-gray-500 dark:text-gray-400">Willkommen zurück.</p>
        </header>

        <section class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-3xl p-8 shadow-2xl">
            <form id="login-form" class="space-y-5" autocomplete="off">
                <div>
                    <label for="login-email" class="block text-sm font-medium text-gray-500 dark:text-gray-400 mb-1">E-Mail-Adresse</label>
                    <input type="email" id="login-email" required placeholder="deine@email.de" class="w-full px-4 py-3 bg-gray-100 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-xl text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                </div>
                <div>
                    <label for="login-password" class="block text-sm font-medium text-gray-500 dark:text-gray-400 mb-1">Passwort</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-3 bg-gray-100 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-xl text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                </div>
                <button type="submit" id="login-submit-btn" class="w-full py-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold rounded-xl shadow-lg transition-all">
                    Einloggen
                </button>
            </form>
            <div id="login-error" class="hidden mt-4 p-4 rounded-xl text-sm bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-800/40 text-red-700 dark:text-red-300"></div>
            <p class="mt-6 text-center text-sm text-gray-500 dark:text-gray-400">
                Noch kein Konto? <a href="/register" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">Registrieren</a>
            </p>
        </section>
    </main>
    <script type="module" src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
