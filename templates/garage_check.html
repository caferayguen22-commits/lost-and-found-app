<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gegenstand prüfen – Lost & Found Berlin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col justify-center items-center font-sans antialiased selection:bg-indigo-500 selection:text-white py-12 transition-colors duration-300">

    <main class="w-full max-w-md px-6">
        <header class="text-center mb-10 relative">
            <button id="theme-toggle" type="button"
                class="absolute right-0 top-0 w-11 h-11 flex items-center justify-center rounded-full bg-gray-200 dark:bg-gray-900 border border-gray-300 dark:border-gray-800 text-gray-600 dark:text-gray-300 hover:border-indigo-500/50 transition-all"
                aria-label="Hell-/Dunkelmodus umschalten">
                <span id="theme-icon">🌙</span>
            </button>
            <a href="/" class="absolute left-0 top-0 h-11 flex items-center text-sm font-semibold text-gray-500 hover:text-gray-800 dark:hover:text-gray-300 transition-colors">&larr; Zurück</a>
            <h1 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 sm:text-4xl">
                Gegenstand prüfen
            </h1>
            <p class="mt-3 text-gray-500 dark:text-gray-400">Kaufst du etwas gebraucht? Prüfe hier, ob der Gegenstand als verloren oder gestohlen gemeldet wurde.</p>
        </header>

        <section class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-3xl p-8 shadow-2xl">
            <form id="check-form" class="space-y-5">
                <div>
                    <label for="check-marks" class="block text-sm font-medium text-gray-500 dark:text-gray-400 mb-1">Seriennummer / Rahmennummer / Kennzeichnung</label>
                    <input type="text" id="check-marks" required placeholder="z.B. FR-12345-XY" class="w-full px-4 py-3 bg-gray-100 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-xl text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                </div>
                <button type="submit" id="check-submit-btn" class="w-full py-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold rounded-xl shadow-lg transition-all">
                    Prüfen
                </button>
            </form>
            <div id="check-result" class="hidden mt-4 p-4 rounded-xl text-sm"></div>
        </section>
    </main>
    <script type="module" src="{{ url_for('static', filename='js/garage-check.js') }}"></script>
</body>
</html>
